# Forgejo-Board-Bot auf dem Docker-Host neben Forgejo.
# Einstellungen in .env neben dieser Datei (Vorlage: .env.beispiel, nie committen).
services:
  board-bot:
    build: .
    image: forgejo-board-bot:lokal
    container_name: forgejo-board-bot
    restart: unless-stopped
    env_file: .env
    ports:
      # Nur für Forgejo erreichbar machen: BOT_BINDUNG auf die Adresse setzen, über die Forgejo den Bot ruft.
      - "${BOT_BINDUNG:-127.0.0.1}:${BOT_PORT:-8080}:8080"
    environment:
      PORT: "8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
